<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="../styles/chamber.css" />
</head>
<body>
<div class="chamber" data-room="academic" dir="rtl">
  <header class="chamber-colophon">
    <div>
      <p>دفتر انتخاب رشته · مهندس رضا ابراهیمی</p>
      <strong>تصویر تحصیلی</strong>
    </div>
    <div class="chamber-colophon__end"><span>دانش‌آموز آزمایشی</span></div>
  </header>
  <nav class="chamber-folio">
    <p>فصل · تصویر تحصیلی</p>
    <div><a href="#">دفتر</a><a href="#">فهرست</a></div>
  </nav>
  <main class="chamber-body">
    <header class="chamber-hero">
      <div>
        <p class="chamber-kicker">اتاق تصویر تحصیلی</p>
        <h1 class="chamber-title">مدرسه، سهمیه و سالی که از آن می‌آیید</h1>
        <p class="chamber-lead">این‌ها اعداد اداری نیستند. زمینهٔ انتخاب رشته‌اند.</p>
      </div>
      <figure class="chamber-scene">
        <svg viewBox="0 0 520 400" width="280">
          <rect x="86" y="168" width="92" height="148" fill="#111" fill-opacity="0.78"/>
          <rect x="186" y="128" width="88" height="188" fill="#b08d4a" fill-opacity="0.55"/>
          <rect x="282" y="156" width="96" height="160" fill="#111" fill-opacity="0.5"/>
        </svg>
        <figcaption>کتاب و کارنامه</figcaption>
      </figure>
    </header>
    <form class="chamber-sheet">
      <section>
        <header><p>گواهی تحصیلی</p><h2>تصویر تحصیلی</h2></header>
        <div class="chamber-field"><label>سال فارغ‌التحصیلی</label><input value="۱۴۰۴" /></div>
        <div class="chamber-field"><label>رشته دبیرستان</label><input value="ریاضی فیزیک" /></div>
        <div class="chamber-field"><label>نام مدرسه</label><input value="دبیرستان البرز" /></div>
      </section>
      <a class="chamber-go" href="#">ادامه مسیر</a>
    </form>
  </main>
</div>
</body>
</html>
