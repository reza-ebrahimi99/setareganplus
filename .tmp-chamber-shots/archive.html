<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="../styles/chamber.css" />
</head>
<body>
<div class="chamber" data-room="archive" dir="rtl">
  <header class="chamber-colophon">
    <div>
      <p>دفتر انتخاب رشته · مهندس رضا ابراهیمی</p>
      <strong>تأیید نهایی</strong>
    </div>
    <div class="chamber-colophon__end"><span>دانش‌آموز آزمایشی</span></div>
  </header>
  <nav class="chamber-folio"><p>فصل · بایگانی</p><div><a href="#">دفتر</a><a href="#">فهرست</a></div></nav>
  <main class="chamber-body">
    <header class="chamber-hero">
      <div>
        <p class="chamber-kicker">بایگانی</p>
        <h1 class="chamber-title">پرونده مهر می‌شود</h1>
        <p class="chamber-lead">تأیید دیجیتال، آخرین امضا روی کاغذ است. پس از آن پوشه‌ها بسته می‌شوند.</p>
        <a class="chamber-go" href="#">تأیید نهایی پرونده</a>
      </div>
      <figure class="chamber-scene">
        <svg viewBox="0 0 520 400" width="280">
          <rect x="86" y="92" width="168" height="228" fill="#111" fill-opacity="0.82"/>
          <rect x="118" y="64" width="168" height="228" fill="#b08d4a" fill-opacity="0.55"/>
          <rect x="154" y="88" width="196" height="244" fill="#faf7f0" stroke="#111" stroke-opacity="0.18"/>
          <circle cx="252" cy="248" r="36" fill="#7a3a2e"/>
        </svg>
        <figcaption>پوشه و مُهر موم</figcaption>
      </figure>
    </header>
  </main>
</div>
</body>
</html>
