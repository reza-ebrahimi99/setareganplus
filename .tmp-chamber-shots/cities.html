<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="../styles/chamber.css" />
</head>
<body>
<div class="chamber" data-room="engine" dir="rtl">
  <header class="chamber-colophon">
    <div>
      <p>دفتر انتخاب رشته · مهندس رضا ابراهیمی</p>
      <strong>شهرها</strong>
    </div>
    <div class="chamber-colophon__end"><span>دانش‌آموز آزمایشی</span></div>
  </header>
  <nav class="chamber-folio"><p>فصل · شهرها</p><div><a href="#">دفتر</a><a href="#">فهرست</a></div></nav>
  <main class="chamber-body">
    <header class="chamber-hero">
      <div>
        <p class="chamber-kicker">ترجیحات جغرافیایی</p>
        <h1 class="chamber-title">کجا حاضرید درس بخوانید</h1>
        <p class="chamber-lead">استان‌ها را به ترتیب اولویت بنویسید. این فهرست یک نقشه است، نه یک فرم چندانتخابی.</p>
      </div>
    </header>
    <ol class="chamber-path">
      <li class="chamber-mile is-active"><p class="chamber-kicker">اول</p><h3>تهران</h3></li>
      <li class="chamber-mile"><p class="chamber-kicker">دوم</p><h3>اصفهان</h3></li>
      <li class="chamber-mile"><p class="chamber-kicker">سوم</p><h3>شیراز</h3></li>
    </ol>
    <a class="chamber-go" href="#">ادامه</a>
  </main>
</div>
</body>
</html>
