<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="../styles/chamber.css" />
</head>
<body>
<div class="chamber" data-room="engine" dir="rtl">
  <header class="chamber-colophon">
    <div>
      <p>دفتر انتخاب رشته · مهندس رضا ابراهیمی</p>
      <strong>نظام آموزشی</strong>
    </div>
    <div class="chamber-colophon__end"><span>دانش‌آموز آزمایشی</span></div>
  </header>
  <nav class="chamber-folio"><p>فصل · نظام آموزشی</p><div><a href="#">دفتر</a><a href="#">فهرست</a></div></nav>
  <main class="chamber-body">
    <header class="chamber-hero">
      <div>
        <p class="chamber-kicker">دوره‌های تحصیلی</p>
        <h1 class="chamber-title">روزانه، شبانه، غیرانتفاعی</h1>
        <p class="chamber-lead">هر دوره یک تصمیم زندگی است. ترتیب را مثل فهرست یک کتاب بچینید.</p>
      </div>
    </header>
    <ol class="chamber-path">
      <li class="chamber-mile is-active"><h3>روزانه</h3></li>
      <li class="chamber-mile"><h3>نوبت دوم</h3></li>
      <li class="chamber-mile"><h3>غیرانتفاعی</h3></li>
    </ol>
    <a class="chamber-go" href="#">ادامه</a>
  </main>
</div>
</body>
</html>
