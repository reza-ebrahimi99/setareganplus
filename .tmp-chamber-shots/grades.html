<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="../styles/chamber.css" />
</head>
<body>
<div class="chamber" data-room="grades" dir="rtl">
  <header class="chamber-colophon">
    <div>
      <p>دفتر انتخاب رشته · مهندس رضا ابراهیمی</p>
      <strong>توانایی‌های شما</strong>
    </div>
    <div class="chamber-colophon__end"><span>سارا محمدی</span></div>
  </header>
  <nav class="chamber-folio">
    <p>فصل · توانایی‌های شما</p>
    <div><a href="#">دفتر</a><a href="#">فهرست</a></div>
  </nav>
  <main class="chamber-body">
    <header class="chamber-hero">
      <div>
        <p class="chamber-kicker">اتاق توانایی‌ها</p>
        <h1 class="chamber-title">شناخت توانایی‌های شما</h1>
        <p class="chamber-lead">هر درس یک قطعه است، نه یک ردیف فرم. نمره را بنویسید و بروید؛ معدل خودش شکل می‌گیرد.</p>
      </div>
    </header>
    <div class="chamber-sheet">
      <p class="chamber-kicker">۸ از ۱۲ · معدل ۱۸٫۴۰</p>
      <section class="chamber-ledger">
        <h2>دروس تخصصی</h2>
        <ol>
          <li data-status="valid"><label><span>ریاضی</span><em>ثبت شد</em></label><input value="۱۹٫۲۵" /></li>
          <li data-status="valid"><label><span>فیزیک</span><em>ثبت شد</em></label><input value="۱۸٫۵۰" /></li>
          <li><label><span>شیمی</span><em>خالی</em></label><input placeholder="۰ تا ۲۰" /></li>
        </ol>
      </section>
    </div>
  </main>
</div>
</body>
</html>
