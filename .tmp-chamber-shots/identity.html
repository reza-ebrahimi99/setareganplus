<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="../styles/chamber.css" />
</head>
<body>
<div class="chamber" data-room="identity" dir="rtl">
  <header class="chamber-colophon">
    <div>
      <p>دفتر انتخاب رشته · مهندس رضا ابراهیمی</p>
      <strong>کی هستید</strong>
    </div>
    <div class="chamber-colophon__end">
      <span>سارا محمدی</span>
      <a href="#">خروج</a>
    </div>
  </header>
  <nav class="chamber-folio">
    <p>فصل · کی هستید</p>
    <div><a href="#">دفتر</a><a href="#">فهرست</a></div>
  </nav>
  <main class="chamber-body">
    <header class="chamber-hero">
      <div>
        <p class="chamber-kicker">اتاق هویت</p>
        <h1 class="chamber-title">قبل از هر انتخاب، باید بدانیم که هستید</h1>
        <p class="chamber-lead">نام، کد ملی و جای زندگی‌تان سنگ بنای پرونده است. هر کلمه خودکار ذخیره می‌شود.</p>
      </div>
      <figure class="chamber-scene">
        <svg viewBox="0 0 520 400" width="280">
          <rect x="148" y="36" width="224" height="308" fill="none" stroke="#111" stroke-opacity="0.2"/>
          <rect x="168" y="56" width="184" height="268" fill="#f4eee0" stroke="#b08d4a" stroke-opacity="0.4"/>
          <circle cx="260" cy="148" r="38" fill="none" stroke="#111" stroke-width="1.5"/>
          <path d="M198 268 C198 214 322 214 322 268" fill="none" stroke="#111" stroke-width="1.5"/>
        </svg>
        <figcaption>پرتره پرونده</figcaption>
      </figure>
    </header>
    <form class="chamber-sheet">
      <section>
        <header>
          <p>کاغذ رسمی</p>
          <h2>کی هستید</h2>
        </header>
        <div class="chamber-field">
          <label>نام و نام خانوادگی</label>
          <input value="سارا محمدی" />
        </div>
        <div class="chamber-field">
          <label>کد ملی</label>
          <input value="۰۰۱۲۳۴۵۶۷۸" />
        </div>
        <div class="chamber-field">
          <label>شهر</label>
          <input value="تهران" />
        </div>
        <div class="chamber-sign">
          <p>امضا</p>
          <strong>رضا ابراهیمی</strong>
        </div>
      </section>
      <a class="chamber-go" href="#">ادامه مسیر</a>
    </form>
  </main>
</div>
</body>
</html>
