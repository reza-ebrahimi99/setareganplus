<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="../styles/chamber.css" />
</head>
<body>
<div class="chamber" data-room="engine" dir="rtl">
  <header class="chamber-colophon">
    <div>
      <p>دفتر انتخاب رشته · مهندس رضا ابراهیمی</p>
      <strong>رشته‌ها</strong>
    </div>
    <div class="chamber-colophon__end"><span>دانش‌آموز آزمایشی</span></div>
  </header>
  <nav class="chamber-folio"><p>فصل · رشته‌ها</p><div><a href="#">دفتر</a><a href="#">فهرست</a></div></nav>
  <main class="chamber-body">
    <header class="chamber-hero">
      <div>
        <p class="chamber-kicker">ترجیحات رشته</p>
        <h1 class="chamber-title">رشته‌هایی که باید روی میز بمانند</h1>
        <p class="chamber-lead">فعال کنید، ستاره بزنید، ترتیب را با سکوت مشخص کنید — نه با جدول ادمین.</p>
      </div>
    </header>
    <ul class="chamber-promises">
      <li>مهندسی برق</li>
      <li>مهندسی کامپیوتر</li>
      <li>علوم کامپیوتر</li>
    </ul>
    <a class="chamber-go" href="#">ادامه</a>
  </main>
</div>
</body>
</html>
