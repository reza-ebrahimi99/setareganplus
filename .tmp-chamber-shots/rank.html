<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="../styles/chamber.css" />
</head>
<body>
<div class="chamber" data-room="engine" dir="rtl">
  <header class="chamber-colophon">
    <div>
      <p>دفتر انتخاب رشته · مهندس رضا ابراهیمی</p>
      <strong>رتبه و سنجش</strong>
    </div>
    <div class="chamber-colophon__end"><span>دانش‌آموز آزمایشی</span></div>
  </header>
  <nav class="chamber-folio"><p>فصل · رتبه و سنجش</p><div><a href="#">دفتر</a><a href="#">فهرست</a></div></nav>
  <main class="chamber-body">
    <header class="chamber-hero">
      <div>
        <p class="chamber-kicker">رتبه و سنجش</p>
        <h1 class="chamber-title">نتایج آزمون سنجش</h1>
        <p class="chamber-lead">رتبه و تراز را روی کاغذ بنویسید. این اعداد حدس مشاور را محدود می‌کنند.</p>
      </div>
    </header>
    <form class="chamber-sheet">
      <div class="chamber-field"><label>رتبه کل</label><input placeholder="مثلاً ۱۲۳۴" /></div>
      <div class="chamber-field"><label>تراز</label><input placeholder="مثلاً ۹۰۰۰" /></div>
      <div class="chamber-field"><label>سهمیه</label><input value="مناطق" /></div>
      <button class="chamber-go" type="button">ثبت رتبه</button>
    </form>
  </main>
</div>
</body>
</html>
