<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="../styles/chamber.css" />
</head>
<body>
<div class="chamber" data-room="session" dir="rtl">
  <header class="chamber-colophon">
    <div>
      <p>دفتر انتخاب رشته · مهندس رضا ابراهیمی</p>
      <strong>نخستین گفتگو</strong>
    </div>
    <div class="chamber-colophon__end"><span>سارا محمدی</span></div>
  </header>
  <nav class="chamber-folio">
    <p>فصل · نخستین گفتگو</p>
    <div><a href="#">دفتر</a><a href="#">فهرست</a></div>
  </nav>
  <main class="chamber-body">
    <header class="chamber-hero">
      <div>
        <p class="chamber-kicker">اتاق گفتگو</p>
        <h1 class="chamber-title">صندلی چرم خالی است</h1>
        <p class="chamber-lead">وقتی تصویر تحصیلی کامل شد، چراغ میز روشن می‌شود. این نشست، حدس را از پرونده جدا می‌کند.</p>
        <a class="chamber-go" href="#">رزرو جلسه تحلیل تخصصی</a>
      </div>
      <figure class="chamber-scene">
        <svg viewBox="0 0 520 400" width="300">
          <path d="M60 342 H460" stroke="#111" stroke-opacity="0.14" fill="none"/>
          <rect x="210" y="312" width="100" height="12" fill="#111" fill-opacity="0.75"/>
          <path d="M260 312 V168" stroke="#111" stroke-width="2.4"/>
          <path d="M260 168 L348 108" stroke="#111" stroke-width="2.4"/>
          <path d="M318 86 L392 138 L368 162 L294 110 Z" fill="#b08d4a"/>
        </svg>
        <figcaption>صندلی چرم</figcaption>
      </figure>
    </header>
  </main>
</div>
</body>
</html>
