<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="../styles/chamber.css" />
</head>
<body>
<div class="chamber" data-room="transcript" dir="rtl">
  <header class="chamber-colophon">
    <div>
      <p>دفتر انتخاب رشته · مهندس رضا ابراهیمی</p>
      <strong>آخرین قطعه تصویر</strong>
    </div>
    <div class="chamber-colophon__end"><span>سارا محمدی</span></div>
  </header>
  <nav class="chamber-folio">
    <p>فصل · آخرین قطعه تصویر</p>
    <div><a href="#">دفتر</a><a href="#">فهرست</a></div>
  </nav>
  <main class="chamber-body">
    <header class="chamber-hero">
      <div>
        <p class="chamber-kicker">اتاق سند</p>
        <h1 class="chamber-title">آخرین قطعه از تصویر تحصیلی شما</h1>
        <p class="chamber-lead">فایل رسمی را بگذارید تا مهندس نمره‌ها را با سند تطبیق دهد.</p>
      </div>
      <figure class="chamber-scene">
        <svg viewBox="0 0 520 400" width="280">
          <rect x="132" y="36" width="248" height="328" fill="#faf7f0" stroke="#111" stroke-opacity="0.16"/>
          <path d="M132 78 H380" stroke="#b08d4a" stroke-width="10"/>
          <path d="M380 36 L456 8 L456 132 L380 96 Z" fill="#b08d4a"/>
          <circle cx="260" cy="292" r="28" fill="none" stroke="#b08d4a" stroke-width="1.6"/>
          <circle cx="260" cy="292" r="8" fill="#b08d4a"/>
        </svg>
        <figcaption>روبان طلایی</figcaption>
      </figure>
    </header>
    <label class="chamber-deed">
      <h2>این سند را روی میز بگذارید</h2>
      <p>PDF رسمی · حداکثر پنج مگابایت</p>
      <span class="chamber-quiet">انتخاب فایل</span>
    </label>
    <a class="chamber-go" href="#">مُهر کردن سند</a>
  </main>
</div>
</body>
</html>
